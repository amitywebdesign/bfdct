name: Build and check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The GitHub Pages build (sub-path, meta CSP, redirect pages), so a branch or PR
      # that breaks it is caught before it is merged.
      - name: Check the GitHub Pages build
        run: npx eleventy && node scripts/check.mjs
        env:
          PAGES: "1"
          PATH_PREFIX: /bfdct/
          SITE_URL: https://example.github.io/bfdct
